@login_required
def profile_view(request):
    return render(request, "profile.html", {"profile": request.user.profile})
<h2>{{ request.user.username }}</h2>
<p>{{ profile.bio }}</p>
{% if profile.avatar %}
  <img src="{{ profile.avatar.url }}" alt="avatar">
{% endif %}
<a href="{% url 'edit_profile' %}">Editar perfil</a>
